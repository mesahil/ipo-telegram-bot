services:
  - type: web
    name: ipo-telegram-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: PAN_LIST
        sync: false
      - key: PORT
        value: "10000"
      # Optional: For AWS deployment, set WEBHOOK_URL to your server URL
      # - key: WEBHOOK_URL
      #   sync: false
